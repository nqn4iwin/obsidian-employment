[project]
name = "obsidian-employment"
version = "0.1.0"
description = "사람인 채용공고 수집·LLM 변환·Quartz 사이트 파이프라인"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "openai>=1.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.scripts]
crawl = "employment_tools.cli:crawl"
convert = "employment_tools.cli:convert"
index = "employment_tools.cli:build_index"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["employment_tools"]
