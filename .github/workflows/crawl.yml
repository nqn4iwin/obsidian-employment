name: Crawl Job Postings

on:
  # schedule:
  #   - cron: "0 0 * * *" # 매일 UTC 0시 (한국 오전 9시)
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Run crawler
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python crawler/saramin_crawler.py

      - name: Commit new postings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "content/진행중인 공고/"
          git diff --cached --quiet || git commit -m "crawl: $(date '+%Y-%m-%d') 공고 자동 수집"
          git push
