# MD 파일 저장 경로 (이 파일 기준 상대경로)
# quartz/crawler/ 안에 넣은 경우 아래 경로 사용
output_dir: "../content/진행중인 공고"

# 검색 조건 목록 (최대 5개 권장)
searches:
  - keyword: "데이터 분석"
    salary_min: "3000만원~"
    job_types: ["정규직"]
    company_types: ["대기업", "중견기업"]

  - keyword: "PM"
    remote_work: true
    job_types: ["정규직", "계약직"]

  - keyword: "헬스케어"
    job_types: ["정규직"]
    exclude_keywords: ["학교"]
